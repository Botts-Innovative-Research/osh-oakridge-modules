BasicSessionConfig.module.name=Έλεγχος ταυτότητας συνεδρίας & κλειδιών πρόσβασης (Passkeys)
BasicSessionConfig.module.description=Επαληθεύει αιτήματα μέσω μόνιμων συνεδριών, τοπικών κωδικών, κλειδιών Passkey/FIDO2, OIDC SSO και διακριτικών ομοσπονδίας
BasicSessionConfig.cookieName.label=Όνομα cookie συνεδρίας
BasicSessionConfig.cookieName.description=Όνομα του αδιαφανούς cookie ελέγχου ταυτότητας.
BasicSessionConfig.idleTimeoutSeconds.label=Όριο αδράνειας (s)
BasicSessionConfig.idleTimeoutSeconds.description=Ακυρώνει τη συνεδρία μετά από τόσα δευτερόλεπτα αδράνειας. Ορίστε 0 για παραμονή σε σύνδεση έως την αποσύνδεση.
BasicSessionConfig.absoluteTimeoutSeconds.label=Μέγιστη διάρκεια (s)
BasicSessionConfig.absoluteTimeoutSeconds.description=Μέγιστη διάρκεια ζωής συνεδρίας σε δευτερόλεπτα. Ορίστε 0 για παραμονή σε σύνδεση έως την αποσύνδεση.
BasicSessionConfig.persistSessions.label=Διατήρηση συνεδριών σε επανεκκινήσεις
BasicSessionConfig.persistSessions.description=Αποθηκεύει σύνοψη SHA-256 συνεδριών στον δίσκο ώστε οι σταθμοί να παραμένουν συνδεδεμένοι μετά από επανεκκινήσεις και αναβαθμίσεις.
BasicSessionConfig.allowKeepSignedIn.label=Επιτρέπεται η Διατήρηση σύνδεσης
BasicSessionConfig.allowKeepSignedIn.description=Επιτρέπει τη διατήρηση του cookie συνεδρίας μετά το κλείσιμο του προγράμματος περιήγησης έως τη ρητή αποσύνδεση.
BasicSessionConfig.persistentCookieMaxAgeSeconds.label=Διάρκεια μόνιμου cookie (s)
BasicSessionConfig.persistentCookieMaxAgeSeconds.description=Διάρκεια Max-Age του cookie όταν είναι ενεργή η Διατήρηση σύνδεσης (προεπιλογή 365 ημέρες).
BasicSessionConfig.secureCookie.label=Ασφαλές cookie
BasicSessionConfig.secureCookie.description=Αποστολή του cookie συνεδρίας μόνο μέσω HTTPS. Διατηρήστε το ενεργό στην παραγωγή.
BasicSessionConfig.sameSite.label=Πολιτική SameSite
BasicSessionConfig.sameSite.description=Χρησιμοποιήστε Strict για τον τοπικό κόμβο. Το None επιτρέπει πρόσβαση μεταξύ τοποθεσιών με διαπιστευτήρια και απαιτεί HTTPS.
BasicSessionConfig.defaultRedirectPath.label=Διαδρομή μετά τη σύνδεση
BasicSessionConfig.defaultRedirectPath.description=Τοπική διαδρομή μετά τη σύνδεση όταν δεν υπάρχει αποθηκευμένος προορισμός.
BasicSessionConfig.webAuthnRpId.label=Τομέας WebAuthn (RP ID)
BasicSessionConfig.webAuthnRpId.description=Προαιρετικός ρητός τομέας για Passkeys (π.χ. oscar.local). Αφήστε κενό για χρήση του ενεργού ονόματος κεντρικού υπολογιστή HTTPS.
BasicSessionConfig.webAuthnRpName.label=Εμφανιζόμενο όνομα WebAuthn
BasicSessionConfig.webAuthnRpName.description=Όνομα που εμφανίζεται στις προτροπές κλειδιού πρόσβασης.
BasicSessionConfig.oidcEnabled.label=Ενεργοποίηση εταιρικού OIDC SSO
BasicSessionConfig.oidcEnabled.description=Ενεργοποιεί προαιρετική ενιαία σύνδεση OpenID Connect παράλληλα με τους τοπικούς λογαριασμούς εκτός σύνδεσης.
BasicSessionConfig.oidcProviderName.label=Ετικέτα παρόχου OIDC
BasicSessionConfig.oidcProviderName.description=Ετικέτα κουμπιού στη σελίδα σύνδεσης (π.χ. Εταιρικό SSO, Okta, Entra ID).
BasicSessionConfig.oidcIssuerUrl.label=URL εκδότη OIDC
BasicSessionConfig.oidcIssuerUrl.description=Διεύθυνση HTTPS εκδότη OpenID Connect με /.well-known/openid-configuration.
BasicSessionConfig.oidcClientId.label=Αναγνωριστικό πελάτη OIDC
BasicSessionConfig.oidcClientId.description=Αναγνωριστικό πελάτη OpenID Connect για αυτόν τον κόμβο OSCAR.
BasicSessionConfig.oidcClientSecret.label=Μυστικό πελάτη OIDC
BasicSessionConfig.oidcClientSecret.description=Προαιρετικό μυστικό πελάτη (κενό για δημόσιους πελάτες PKCE).
BasicSessionConfig.oidcScopes.label=Εμβέλειες OIDC (Scopes)
BasicSessionConfig.oidcScopes.description=Εμβέλειες OIDC διαχωρισμένες με κενά κατά τη σύνδεση.
BasicSessionConfig.oidcAdminGroup.label=Ομάδα Διαχειριστών OIDC
BasicSessionConfig.oidcAdminGroup.description=Ομάδα ή ρόλος παρόχου που αντιστοιχεί στον ρόλο Διαχειριστή του OSCAR.
BasicSessionConfig.oidcOperatorGroup.label=Ομάδα Χειριστών OIDC
BasicSessionConfig.oidcOperatorGroup.description=Ομάδα ή ρόλος παρόχου που αντιστοιχεί στον ρόλο Χειριστή του OSCAR.
BasicSessionConfig.oidcDefaultRole.label=Προεπιλεγμένος ρόλος OIDC
BasicSessionConfig.oidcDefaultRole.description=Εφεδρικός ρόλος (viewer ή operator) όταν δεν αντιστοιχεί καμία ομάδα.
BasicSessionConfig.oidcTrustedCaCertificatePath.label=Διαδρομή προσαρμοσμένου πιστοποιητικού CA OIDC
BasicSessionConfig.oidcTrustedCaCertificatePath.description=Προαιρετικό αρχείο PEM ή φάκελος πιστοποιητικών .crt/.pem ιδιωτικής αρχής CA για διακομιστές OIDC παράλληλα με τις δημόσιες αρχές CA.
BasicSessionConfig.externalIdentityConsoleUrl.label=URL εξωτερικής κονσόλας διαχείρισης SSO
BasicSessionConfig.externalIdentityConsoleUrl.description=Προαιρετική διεύθυνση HTTPS εξωτερικής κονσόλας ομοσπονδιακών χρηστών (Authentik, Keycloak, Entra ID ή Okta) που εμφανίζεται στη σελίδα Χρήστες & πρόσβαση.
BasicSessionConfig.trustedTunnelSsoEnabled.label=Ενεργοποίηση SSO έμπιστης σήραγγας
BasicSessionConfig.trustedTunnelSsoEnabled.description=Αποδέχεται επαληθευμένες κεφαλίδες ταυτότητας από τοπική σήραγγα Zero Trust (Octelium).
BasicSessionConfig.trustedTunnelUserHeader.label=Κεφαλίδα χρήστη σήραγγας
BasicSessionConfig.trustedTunnelUserHeader.description=Κεφαλίδα HTTP με το επαληθευμένο όνομα χρήστη της σήραγγας.
BasicSessionConfig.trustedTunnelGroupsHeader.label=Κεφαλίδα ομάδων σήραγγας
BasicSessionConfig.trustedTunnelGroupsHeader.description=Προαιρετική κεφαλίδα HTTP με επαληθευμένες ομάδες σήραγγας που αντιστοιχίζονται στις ομάδες Διαχειριστών/Χειριστών OIDC.
BasicSessionConfig.trustedTunnelSharedSecret.label=Κοινόχρηστο μυστικό σήραγγας
BasicSessionConfig.trustedTunnelSharedSecret.description=Απαιτούμενο μυστικό (>= 16 χαρακτήρες) για την κεφαλίδα X-Oscar-Tunnel-Secret.
BasicSessionConfig.trustedTunnelAutoProvisionViewer.label=Αυτόματη δημιουργία προφίλ Θεατή από σήραγγα
BasicSessionConfig.trustedTunnelAutoProvisionViewer.description=Δημιουργεί αυτόματα προφίλ μόνο για ανάγνωση όταν ο χρήστης της σήραγγας δεν έχει τοπικό λογαριασμό.

BasicSessionConfig.module.name=Authentification par session et clés d'accès (Passkeys)
BasicSessionConfig.module.description=Authentifie les requêtes via sessions persistantes, mots de passe locaux, clés Passkey/FIDO2, OIDC SSO et jetons de fédération
BasicSessionConfig.cookieName.label=Cookie de session
BasicSessionConfig.cookieName.description=Nom du cookie d'authentification opaque.
BasicSessionConfig.idleTimeoutSeconds.label=Expiration d'inactivité (s)
BasicSessionConfig.idleTimeoutSeconds.description=Invalide une session après ce délai sans requête. Mettre 0 pour rester connecté jusqu'à déconnexion explicite.
BasicSessionConfig.absoluteTimeoutSeconds.label=Durée maximale (s)
BasicSessionConfig.absoluteTimeoutSeconds.description=Durée maximale totale en secondes. Mettre 0 pour rester connecté jusqu'à déconnexion explicite.
BasicSessionConfig.persistSessions.label=Persister les sessions aux redémarrages
BasicSessionConfig.persistSessions.description=Enregistre les empreintes SHA-256 des sessions sur disque pour survivre aux redémarrages et mises à niveau.
BasicSessionConfig.allowKeepSignedIn.label=Autoriser Rester connecté
BasicSessionConfig.allowKeepSignedIn.description=Permet de conserver le cookie de session après fermeture du navigateur jusqu'à déconnexion explicite.
BasicSessionConfig.persistentCookieMaxAgeSeconds.label=Durée du cookie persistant (s)
BasicSessionConfig.persistentCookieMaxAgeSeconds.description=Durée Max-Age du cookie lorsque Rester connecté est actif (365 jours par défaut).
BasicSessionConfig.secureCookie.label=Cookie sécurisé
BasicSessionConfig.secureCookie.description=Envoie le cookie de session uniquement via HTTPS. Laisser activé en production.
BasicSessionConfig.sameSite.label=Politique SameSite
BasicSessionConfig.sameSite.description=Utiliser Strict pour le nœud local. None autorise l'accès intersites authentifié à un nœud externe et exige HTTPS.
BasicSessionConfig.defaultRedirectPath.label=Chemin après connexion
BasicSessionConfig.defaultRedirectPath.description=Chemin local utilisé après la connexion lorsqu'aucune destination n'est enregistrée.
BasicSessionConfig.webAuthnRpId.label=Domaine WebAuthn (RP ID)
BasicSessionConfig.webAuthnRpId.description=Domaine explicite facultatif pour les clés Passkey (ex. oscar.local). Laisser vide pour utiliser l'hôte HTTPS actif.
BasicSessionConfig.webAuthnRpName.label=Nom affiché WebAuthn
BasicSessionConfig.webAuthnRpName.description=Nom affiché dans les invites de clés d'accès du navigateur ou des clés matérielles.
BasicSessionConfig.oidcEnabled.label=Activer le SSO d'organisation OIDC
BasicSessionConfig.oidcEnabled.description=Active l'authentification unique OpenID Connect en complément des comptes locaux hors ligne.
BasicSessionConfig.oidcProviderName.label=Libellé du fournisseur OIDC
BasicSessionConfig.oidcProviderName.description=Libellé du bouton sur la page de connexion (ex. SSO Organisation, Okta, Entra ID).
BasicSessionConfig.oidcIssuerUrl.label=URL de l'émetteur OIDC
BasicSessionConfig.oidcIssuerUrl.description=URL HTTPS OpenID Connect exposant /.well-known/openid-configuration.
BasicSessionConfig.oidcClientId.label=ID client OIDC
BasicSessionConfig.oidcClientId.description=Identifiant client OpenID Connect enregistré pour ce nœud OSCAR.
BasicSessionConfig.oidcClientSecret.label=Secret client OIDC
BasicSessionConfig.oidcClientSecret.description=Secret client confidentiel facultatif (laisser vide pour PKCE public).
BasicSessionConfig.oidcScopes.label=Portées OIDC (Scopes)
BasicSessionConfig.oidcScopes.description=Portées OIDC séparées par des espaces demandées à la connexion.
BasicSessionConfig.oidcAdminGroup.label=Groupe OIDC Administrateurs
BasicSessionConfig.oidcAdminGroup.description=Groupe ou rôle du fournisseur associé au rôle Administrateur OSCAR.
BasicSessionConfig.oidcOperatorGroup.label=Groupe OIDC Opérateurs
BasicSessionConfig.oidcOperatorGroup.description=Groupe ou rôle du fournisseur associé au rôle Opérateur OSCAR.
BasicSessionConfig.oidcDefaultRole.label=Rôle OIDC par défaut
BasicSessionConfig.oidcDefaultRole.description=Rôle attribué par défaut (viewer ou operator) sans correspondance de groupe.
BasicSessionConfig.trustedTunnelSsoEnabled.label=Activer le SSO par tunnel de confiance
BasicSessionConfig.trustedTunnelSsoEnabled.description=Accepte les en-têtes d'identité vérifiés injectés par le conteneur tunnel Zero Trust (Octelium).
BasicSessionConfig.trustedTunnelUserHeader.label=En-tête d'identité du tunnel
BasicSessionConfig.trustedTunnelUserHeader.description=En-tête HTTP contenant l'identifiant vérifié du tunnel.
BasicSessionConfig.trustedTunnelSharedSecret.label=Secret partagé du tunnel
BasicSessionConfig.trustedTunnelSharedSecret.description=Secret obligatoire (>= 16 caractères) vérifié via X-Oscar-Tunnel-Secret.
BasicSessionConfig.trustedTunnelAutoProvisionViewer.label=Créer automatiquement un profil Lecteur depuis le tunnel
BasicSessionConfig.trustedTunnelAutoProvisionViewer.description=Crée automatiquement un profil lecture seule lorsqu'un utilisateur vérifié du tunnel n'a pas de compte local.

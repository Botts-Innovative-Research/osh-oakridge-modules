BasicSessionConfig.module.name=Autenticación por sesión y llaves de acceso (Passkeys)
BasicSessionConfig.module.description=Autentica solicitudes mediante sesiones persistentes, contraseñas locales, llaves Passkey/FIDO2, OIDC SSO y tokens de federación
BasicSessionConfig.cookieName.label=Cookie de sesión
BasicSessionConfig.cookieName.description=Nombre de la cookie de autenticación opaca.
BasicSessionConfig.idleTimeoutSeconds.label=Inactividad máx. (s)
BasicSessionConfig.idleTimeoutSeconds.description=Invalida una sesión tras estos segundos sin actividad. Use 0 para mantener la sesión hasta cerrar sesión manualmente.
BasicSessionConfig.absoluteTimeoutSeconds.label=Duración máx. (s)
BasicSessionConfig.absoluteTimeoutSeconds.description=Duración máxima total en segundos. Use 0 para mantener la sesión hasta cerrar sesión manualmente.
BasicSessionConfig.persistSessions.label=Persistir sesiones tras reinicios
BasicSessionConfig.persistSessions.description=Guarda resúmenes SHA-256 de sesión en disco para mantener la sesión activa tras reinicios y actualizaciones.
BasicSessionConfig.allowKeepSignedIn.label=Permitir mantener la sesión iniciada
BasicSessionConfig.allowKeepSignedIn.description=Permite conservar la cookie de sesión al cerrar y reabrir el navegador hasta cerrar sesión explícitamente.
BasicSessionConfig.persistentCookieMaxAgeSeconds.label=Duración de cookie persistente (s)
BasicSessionConfig.persistentCookieMaxAgeSeconds.description=Valor Max-Age de la cookie cuando se mantiene la sesión iniciada (365 días por defecto).
BasicSessionConfig.secureCookie.label=Cookie segura
BasicSessionConfig.secureCookie.description=Envía la cookie de sesión solo por HTTPS. Manténgalo activado en producción.
BasicSessionConfig.sameSite.label=Política SameSite
BasicSessionConfig.sameSite.description=Use Strict para el nodo local. None permite acceso entre sitios autenticado a un nodo externo y requiere HTTPS.
BasicSessionConfig.defaultRedirectPath.label=Ruta tras inicio
BasicSessionConfig.defaultRedirectPath.description=Ruta local utilizada tras iniciar sesión cuando no hay un destino guardado.
BasicSessionConfig.webAuthnRpId.label=Dominio WebAuthn (RP ID)
BasicSessionConfig.webAuthnRpId.description=Dominio explícito opcional para llaves Passkey (ej. oscar.local). Déjelo vacío para usar el nombre de host HTTPS activo.
BasicSessionConfig.webAuthnRpName.label=Nombre para mostrar WebAuthn
BasicSessionConfig.webAuthnRpName.description=Nombre mostrado en los avisos de llaves de acceso del navegador o llave física.
BasicSessionConfig.oidcEnabled.label=Habilitar SSO corporativo OIDC
BasicSessionConfig.oidcEnabled.description=Activa el inicio de sesión único OpenID Connect opcional junto a las cuentas locales sin conexión.
BasicSessionConfig.oidcProviderName.label=Etiqueta del proveedor OIDC
BasicSessionConfig.oidcProviderName.description=Texto del botón SSO en la pantalla de acceso (ej. SSO Corporativo, Okta, Entra ID).
BasicSessionConfig.oidcIssuerUrl.label=URL del emisor OIDC
BasicSessionConfig.oidcIssuerUrl.description=URL HTTPS del emisor OpenID Connect con /.well-known/openid-configuration.
BasicSessionConfig.oidcClientId.label=ID de cliente OIDC
BasicSessionConfig.oidcClientId.description=Identificador del cliente OpenID Connect registrado para este nodo OSCAR.
BasicSessionConfig.oidcClientSecret.label=Secreto de cliente OIDC
BasicSessionConfig.oidcClientSecret.description=Secreto opcional para clientes confidenciales (vacío para clientes públicos PKCE).
BasicSessionConfig.oidcScopes.label=Ámbitos OIDC (Scopes)
BasicSessionConfig.oidcScopes.description=Ámbitos OIDC separados por espacios solicitados al iniciar sesión.
BasicSessionConfig.oidcAdminGroup.label=Grupo OIDC de Administradores
BasicSessionConfig.oidcAdminGroup.description=Grupo o rol del proveedor asignado al rol Administrador de OSCAR.
BasicSessionConfig.oidcOperatorGroup.label=Grupo OIDC de Operadores
BasicSessionConfig.oidcOperatorGroup.description=Grupo o rol del proveedor asignado al rol Operador de OSCAR.
BasicSessionConfig.oidcDefaultRole.label=Rol OIDC predeterminado
BasicSessionConfig.oidcDefaultRole.description=Rol asignado por defecto (viewer u operator) cuando no coincide ningún grupo.
BasicSessionConfig.trustedTunnelSsoEnabled.label=Habilitar SSO de túnel confiable
BasicSessionConfig.trustedTunnelSsoEnabled.description=Acepta cabeceras de identidad verificadas del contenedor de túnel Zero Trust (Octelium).
BasicSessionConfig.trustedTunnelUserHeader.label=Cabecera de usuario del túnel
BasicSessionConfig.trustedTunnelUserHeader.description=Cabecera HTTP con el usuario verificado por el túnel.
BasicSessionConfig.trustedTunnelSharedSecret.label=Secreto compartido del túnel
BasicSessionConfig.trustedTunnelSharedSecret.description=Secreto obligatorio (>= 16 caracteres) verificado en X-Oscar-Tunnel-Secret.
BasicSessionConfig.trustedTunnelAutoProvisionViewer.label=Crear perfil Lector automáticamente desde túnel
BasicSessionConfig.trustedTunnelAutoProvisionViewer.description=Crea automáticamente un perfil de solo lectura cuando un usuario verificado del túnel no existe localmente.

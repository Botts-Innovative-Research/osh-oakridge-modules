BasicSessionConfig.module.name=Session & Passkey Authentication
BasicSessionConfig.module.description=Authenticates browser, passkey, OIDC SSO, tunnel, and federation token requests using persistent server-side sessions
BasicSessionConfig.cookieName.label=Session cookie name
BasicSessionConfig.cookieName.description=Name of the opaque authentication cookie.
BasicSessionConfig.idleTimeoutSeconds.label=Idle timeout (seconds)
BasicSessionConfig.idleTimeoutSeconds.description=Invalidate a session after this many seconds without a request. Set to 0 to stay signed in until explicit logout.
BasicSessionConfig.absoluteTimeoutSeconds.label=Absolute timeout (seconds)
BasicSessionConfig.absoluteTimeoutSeconds.description=Maximum session lifetime in seconds, even while active. Set to 0 to stay signed in until explicit logout.
BasicSessionConfig.persistSessions.label=Persist sessions across restarts
BasicSessionConfig.persistSessions.description=Store SHA-256 session digests on disk so workstations remain signed in across server reboots and upgrades.
BasicSessionConfig.allowKeepSignedIn.label=Allow Keep Me Signed In
BasicSessionConfig.allowKeepSignedIn.description=Allow operators to retain their session cookie across browser restarts until explicit logout.
BasicSessionConfig.persistentCookieMaxAgeSeconds.label=Persistent cookie lifetime (seconds)
BasicSessionConfig.persistentCookieMaxAgeSeconds.description=Browser cookie Max-Age when Keep Me Signed In is active (default 365 days).
BasicSessionConfig.secureCookie.label=Secure cookie
BasicSessionConfig.secureCookie.description=Only send the session cookie over HTTPS. Keep enabled in production.
BasicSessionConfig.sameSite.label=SameSite policy
BasicSessionConfig.sameSite.description=Use Strict for the local node. None permits credentialed cross-site access to an external node and requires HTTPS.
BasicSessionConfig.defaultRedirectPath.label=Default redirect path
BasicSessionConfig.defaultRedirectPath.description=Local path used after login when there is no saved destination.
BasicSessionConfig.webAuthnRpId.label=WebAuthn Relying Party ID
BasicSessionConfig.webAuthnRpId.description=Optional explicit domain for Passkeys (e.g. oscar.local). Leave blank to match the active HTTPS hostname.
BasicSessionConfig.webAuthnRpName.label=WebAuthn Relying Party Name
BasicSessionConfig.webAuthnRpName.description=Display name shown in browser and security-key passkey prompts.
BasicSessionConfig.oidcEnabled.label=Enable Organization OIDC SSO
BasicSessionConfig.oidcEnabled.description=Enable optional OpenID Connect Single Sign-On alongside local offline accounts.
BasicSessionConfig.oidcProviderName.label=OIDC Provider Label
BasicSessionConfig.oidcProviderName.description=Button label shown on the sign-in page (e.g. Organization SSO, Okta, Entra ID).
BasicSessionConfig.oidcIssuerUrl.label=OIDC Issuer URL
BasicSessionConfig.oidcIssuerUrl.description=HTTPS OpenID Connect issuer URL hosting /.well-known/openid-configuration.
BasicSessionConfig.oidcClientId.label=OIDC Client ID
BasicSessionConfig.oidcClientId.description=OpenID Connect client identifier registered for this OSCAR node.
BasicSessionConfig.oidcClientSecret.label=OIDC Client Secret
BasicSessionConfig.oidcClientSecret.description=Optional confidential client secret (leave blank for public PKCE clients).
BasicSessionConfig.oidcScopes.label=OIDC Scopes
BasicSessionConfig.oidcScopes.description=Space-delimited OIDC scopes requested during login.
BasicSessionConfig.oidcAdminGroup.label=OIDC Administrator Group
BasicSessionConfig.oidcAdminGroup.description=Group or role claim value mapped to the OSCAR Administrator role.
BasicSessionConfig.oidcOperatorGroup.label=OIDC Operator Group
BasicSessionConfig.oidcOperatorGroup.description=Group or role claim value mapped to the OSCAR Operator role.
BasicSessionConfig.oidcDefaultRole.label=OIDC Default Role
BasicSessionConfig.oidcDefaultRole.description=Fallback role (viewer or operator) when an SSO user matches no group mapping.
BasicSessionConfig.trustedTunnelSsoEnabled.label=Enable Trusted Tunnel SSO
BasicSessionConfig.trustedTunnelSsoEnabled.description=Accept verified user identity headers injected by an authenticated Zero Trust tunnel sidecar (Octelium).
BasicSessionConfig.trustedTunnelUserHeader.label=Trusted Tunnel Identity Header
BasicSessionConfig.trustedTunnelUserHeader.description=HTTP header carrying the verified tunnel username.
BasicSessionConfig.trustedTunnelSharedSecret.label=Trusted Tunnel Shared Secret
BasicSessionConfig.trustedTunnelSharedSecret.description=Required shared secret (>= 16 chars) matched against X-Oscar-Tunnel-Secret.
BasicSessionConfig.trustedTunnelAutoProvisionViewer.label=Auto-Provision Tunnel Users as Viewer
BasicSessionConfig.trustedTunnelAutoProvisionViewer.description=Automatically create a read-only Viewer profile when a verified tunnel user has no local account.

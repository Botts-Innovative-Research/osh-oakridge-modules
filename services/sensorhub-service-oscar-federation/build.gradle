description = 'OSCAR Node Federation Service'
ext.details = 'Provides secure one-hop OSCAR node federation'
version = '0.1.0'

dependencies {
    implementation 'org.sensorhub:sensorhub-core:' + oshCoreVersion
    implementation project(':sensorhub-service-oscar')
    implementation project(':sensorhub-utils-rad')
    implementation 'com.google.code.gson:gson:2.11.0'
    embeddedImpl 'org.eclipse.jetty.websocket:websocket-client:9.4.57.v20241219'
}

osgi {
    manifest {
        attributes('Bundle-Vendor': 'Botts Innovative Research, Inc.')
        attributes('Bundle-Activator': 'com.botts.impl.service.oscar.federation.Activator')
    }
}

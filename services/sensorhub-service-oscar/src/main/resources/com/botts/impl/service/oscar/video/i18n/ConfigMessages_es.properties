VideoRetentionConfig.timeToRetention.label=Antigüedad antes de conservar cinco fotogramas (días)
VideoRetentionConfig.timeToRetention.description=Antigüedad en días antes de convertir el vídeo fuente de una ocupación en exactamente cinco imágenes JPEG conservadas; el MP4 fuente se mantiene durante el período de reversión configurado
VideoRetentionConfig.videoQueryPeriod.label=Periodo de consulta de vídeo (minutos)
VideoRetentionConfig.videoQueryPeriod.description=Minutos entre consultas de vídeo; los valores mayores cargan más ocupaciones y rutas a la vez
VideoRetentionConfig.maximumCatchUpHours.label=Recuperación máxima de retención (horas)
VideoRetentionConfig.maximumCatchUpHours.description=Intervalo máximo de tiempo de eventos procesado por ciclo; el cursor duradero reanuda el historial restante
VideoRetentionConfig.lateArrivalOverlapHours.label=Margen de llegadas tardías (horas)
VideoRetentionConfig.lateArrivalOverlapHours.description=Tiempo permitido para una confirmación tardía antes de que el cursor diferido continuo finalice la marca de tiempo; la reconciliación histórica recupera llegadas más antiguas
VideoRetentionConfig.lateArrivalScanPeriodMinutes.label=Periodo de revisión de llegadas tardías (minutos)
VideoRetentionConfig.lateArrivalScanPeriodMinutes.description=Tiempo mínimo entre comprobaciones de un nuevo límite seguro diferido; una revisión congelada e interrumpida se reanuda inmediatamente
VideoRetentionConfig.lateArrivalCatchUpHours.label=Recuperación de llegadas tardías por ciclo (horas)
VideoRetentionConfig.lateArrivalCatchUpHours.description=Intervalo máximo de tiempo de eventos de una revisión activa procesado por ciclo programado
VideoRetentionConfig.reconciliationCatchUpHours.label=Reconciliación histórica por ciclo (horas)
VideoRetentionConfig.reconciliationCatchUpHours.description=Intervalo máximo procesado por ciclo mientras una revisión del historial completo avanza hacia su límite congelado
VideoRetentionConfig.reconciliationPeriodHours.label=Periodo de reconciliación histórica (horas)
VideoRetentionConfig.reconciliationPeriodHours.description=Espera tras completar una revisión congelada del historial antes de reiniciar desde la ocupación más antigua; las revisiones activas o fallidas continúan en el ciclo siguiente
VideoRetentionConfig.occupancyStreamRefreshMinutes.label=Periodo de actualización de flujos de ocupación (minutos)
VideoRetentionConfig.occupancyStreamRefreshMinutes.description=Frecuencia de actualización de los ID de flujos de ocupación almacenados en caché para consultar directamente por ID
VideoRetentionConfig.maintenanceWorkLimit.label=Límite de trabajo de mantenimiento multimedia
VideoRetentionConfig.maintenanceWorkLimit.description=Máximo de entradas de reconciliación del catálogo, ciclo de vida del origen y reintento inspeccionadas por ciclo
VideoRetentionConfig.metadataReclamationWorkLimit.label=Límite de reclamación de metadatos multimedia
VideoRetentionConfig.metadataReclamationWorkLimit.description=Máximo de horas UTC de observaciones procesadas reclamadas por ciclo; cada hora usa doce accesos fijos de cinco minutos sin recorrer directorios
VideoRetentionConfig.enableFrameRetention.label=Activar retención de fotogramas
VideoRetentionConfig.enableFrameRetention.description=Elimina todos salvo el número configurado de fotogramas en vez de borrar el clip completo
VideoRetentionConfig.frameRetentionCount.label=Número de fotogramas retenidos
VideoRetentionConfig.frameRetentionCount.description=Número de fotogramas que se conservan cuando la retención está activada
VideoRetentionConfig.jpegQuality.label=Calidad JPEG retenida
VideoRetentionConfig.jpegQuality.description=Calidad JPEG sRGB de línea base de 1 a 100
VideoRetentionConfig.sourceRollbackGraceHours.label=Gracia de reversión del origen (horas)
VideoRetentionConfig.sourceRollbackGraceHours.description=Horas durante las que se conserva el vídeo original tras publicar de forma duradera los cinco JPEG
VideoRetentionConfig.enableSecondaryFramePruning.label=Activar depuración de fotogramas secundarios
VideoRetentionConfig.enableSecondaryFramePruning.description=Elimina los fotogramas retenidos 1, 2, 4 y 5 tras el período de retención secundario y conserva únicamente el fotograma 3 (MIDDLE)
VideoRetentionConfig.secondaryFrameRetentionDays.label=Retención de fotogramas secundarios (días)
VideoRetentionConfig.secondaryFrameRetentionDays.description=Días de conservación de los fotogramas 1, 2, 4 y 5 antes de depurarlos y mantener solo el fotograma 3 (MIDDLE)

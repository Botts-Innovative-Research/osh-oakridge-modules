VideoRetentionConfig.timeToRetention.label=Âge avant conservation de cinq images (jours)
VideoRetentionConfig.timeToRetention.description=Âge en jours avant de convertir la vidéo source d'une occupation en exactement cinq images JPEG conservées ; le MP4 source est maintenu pendant la période de retour arrière configurée
VideoRetentionConfig.videoQueryPeriod.label=Période de requête vidéo (minutes)
VideoRetentionConfig.videoQueryPeriod.description=Minutes entre les requêtes vidéo ; les valeurs élevées chargent plus d'occupations et de chemins à la fois
VideoRetentionConfig.maximumCatchUpHours.label=Rattrapage maximal de conservation (heures)
VideoRetentionConfig.maximumCatchUpHours.description=Plage maximale de temps d'événement traitée par cycle ; le curseur durable reprend ensuite l'historique restant
VideoRetentionConfig.lateArrivalOverlapHours.label=Délai toléré pour les arrivées tardives (heures)
VideoRetentionConfig.lateArrivalOverlapHours.description=Délai accordé à une validation tardive avant que le curseur différé continu finalise l'horodatage ; la réconciliation historique récupère les arrivées plus anciennes
VideoRetentionConfig.lateArrivalScanPeriodMinutes.label=Période de balayage des arrivées tardives (minutes)
VideoRetentionConfig.lateArrivalScanPeriodMinutes.description=Délai minimal entre les vérifications d'une nouvelle limite sûre différée ; un balayage figé interrompu reprend immédiatement
VideoRetentionConfig.lateArrivalCatchUpHours.label=Rattrapage des arrivées tardives par cycle (heures)
VideoRetentionConfig.lateArrivalCatchUpHours.description=Plage maximale de temps d'événement d'un balayage actif traitée par cycle planifié
VideoRetentionConfig.reconciliationCatchUpHours.label=Réconciliation historique par cycle (heures)
VideoRetentionConfig.reconciliationCatchUpHours.description=Plage maximale traitée par cycle pendant qu'un balayage de l'historique complet avance vers sa limite figée
VideoRetentionConfig.reconciliationPeriodHours.label=Période de réconciliation historique (heures)
VideoRetentionConfig.reconciliationPeriodHours.description=Délai après un balayage figé complet avant de repartir de la plus ancienne occupation ; les balayages actifs ou en échec reprennent au cycle suivant
VideoRetentionConfig.occupancyStreamRefreshMinutes.label=Période d'actualisation des flux d'occupation (minutes)
VideoRetentionConfig.occupancyStreamRefreshMinutes.description=Fréquence d'actualisation des identifiants de flux d'occupation en cache afin d'interroger directement par identifiant
VideoRetentionConfig.maintenanceWorkLimit.label=Limite de travail de maintenance des médias
VideoRetentionConfig.maintenanceWorkLimit.description=Nombre maximal d'entrées de rapprochement du catalogue, de cycle de vie source et de nouvelle tentative examinées par cycle
VideoRetentionConfig.metadataReclamationWorkLimit.label=Limite de récupération des métadonnées multimédias
VideoRetentionConfig.metadataReclamationWorkLimit.description=Nombre maximal d'heures UTC d'observations traitées récupérées par cycle ; chaque heure utilise douze accès fixes de cinq minutes sans parcourir de répertoire
VideoRetentionConfig.enableFrameRetention.label=Activer la conservation d'images
VideoRetentionConfig.enableFrameRetention.description=Supprime toutes les images sauf le nombre configuré au lieu d'effacer tout le clip
VideoRetentionConfig.frameRetentionCount.label=Nombre d'images conservées
VideoRetentionConfig.frameRetentionCount.description=Nombre d'images vidéo conservées lorsque la conservation est activée
VideoRetentionConfig.jpegQuality.label=Qualité JPEG conservée
VideoRetentionConfig.jpegQuality.description=Qualité JPEG sRGB de base de 1 à 100
VideoRetentionConfig.sourceRollbackGraceHours.label=Délai de retour arrière de la source (heures)
VideoRetentionConfig.sourceRollbackGraceHours.description=Heures de conservation de la vidéo source après publication durable des cinq JPEG
VideoRetentionConfig.enableSecondaryFramePruning.label=Activer l'élagage des images secondaires
VideoRetentionConfig.enableSecondaryFramePruning.description=Supprime les images conservées 1, 2, 4 et 5 après la période de conservation secondaire et ne conserve que l'image 3 (MIDDLE)
VideoRetentionConfig.secondaryFrameRetentionDays.label=Conservation des images secondaires (jours)
VideoRetentionConfig.secondaryFrameRetentionDays.description=Jours de conservation des images 1, 2, 4 et 5 avant leur élagage en ne conservant que l'image 3 (MIDDLE)

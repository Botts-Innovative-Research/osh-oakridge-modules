VideoRetentionConfig.timeToRetention.label=Âge avant conservation de cinq images (jours)
VideoRetentionConfig.timeToRetention.description=Âge en jours avant de convertir la vidéo source d'une occupation en exactement cinq images JPEG conservées ; le MP4 source est maintenu pendant la période de retour arrière configurée
VideoRetentionConfig.videoQueryPeriod.label=Période de requête vidéo (minutes)
VideoRetentionConfig.videoQueryPeriod.description=Minutes entre les requêtes vidéo ; les valeurs élevées chargent plus d'occupations et de chemins à la fois
VideoRetentionConfig.maximumCatchUpHours.label=Rattrapage maximal de conservation (heures)
VideoRetentionConfig.maximumCatchUpHours.description=Plage maximale de temps d'événement traitée par cycle ; le curseur durable reprend ensuite l'historique restant
VideoRetentionConfig.lateArrivalOverlapHours.label=Chevauchement des arrivées tardives (heures)
VideoRetentionConfig.lateArrivalOverlapHours.description=Plage récente réanalysée pour détecter les validations tardives ; les identifiants durables évitent le travail en double
VideoRetentionConfig.reconciliationCatchUpHours.label=Réconciliation historique par cycle (heures)
VideoRetentionConfig.reconciliationCatchUpHours.description=Plage historique revérifiée progressivement par cycle pour réparer les médias non catalogués
VideoRetentionConfig.maintenanceWorkLimit.label=Limite de travail de maintenance des médias
VideoRetentionConfig.maintenanceWorkLimit.description=Nombre maximal d'entrées de rapprochement du catalogue, de cycle de vie source et de nouvelle tentative examinées par cycle
VideoRetentionConfig.enableFrameRetention.label=Activer la conservation d'images
VideoRetentionConfig.enableFrameRetention.description=Supprime toutes les images sauf le nombre configuré au lieu d'effacer tout le clip
VideoRetentionConfig.frameRetentionCount.label=Nombre d'images conservées
VideoRetentionConfig.frameRetentionCount.description=Nombre d'images vidéo conservées lorsque la conservation est activée
VideoRetentionConfig.jpegQuality.label=Qualité JPEG conservée
VideoRetentionConfig.jpegQuality.description=Qualité JPEG sRGB de base de 1 à 100
VideoRetentionConfig.sourceRollbackGraceHours.label=Délai de retour arrière de la source (heures)
VideoRetentionConfig.sourceRollbackGraceHours.description=Heures de conservation de la vidéo source après publication durable des cinq JPEG

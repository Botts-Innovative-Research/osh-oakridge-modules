VideoRetentionConfig.timeToRetention.label=Age Before Five-Frame Retention (days)
VideoRetentionConfig.timeToRetention.description=Age in days before an occupancy source video is converted to exactly five retained JPEG images; the source MP4 remains through the configured rollback grace period
VideoRetentionConfig.videoQueryPeriod.label=Video Query Period (minutes)
VideoRetentionConfig.videoQueryPeriod.description=Minutes between occupancy-video queries; larger values load more occupancies and paths at once
VideoRetentionConfig.maximumCatchUpHours.label=Maximum Retention Catch-up (hours)
VideoRetentionConfig.maximumCatchUpHours.description=Maximum event-time span processed per cycle; the durable cursor resumes remaining history later
VideoRetentionConfig.lateArrivalOverlapHours.label=Late-arrival Allowance (hours)
VideoRetentionConfig.lateArrivalOverlapHours.description=Time allowed for a late commit before the contiguous delayed cursor finalizes a timestamp; full-history reconciliation recovers older late commits
VideoRetentionConfig.lateArrivalScanPeriodMinutes.label=Late-arrival Sweep Period (minutes)
VideoRetentionConfig.lateArrivalScanPeriodMinutes.description=Minimum time between checks for a newer delayed safe boundary; interrupted frozen sweeps resume immediately from their durable cursor
VideoRetentionConfig.lateArrivalCatchUpHours.label=Late-arrival Catch-up per Cycle (hours)
VideoRetentionConfig.lateArrivalCatchUpHours.description=Maximum event-time span of an active late-arrival sweep processed in one scheduled cycle
VideoRetentionConfig.reconciliationCatchUpHours.label=Historical Reconciliation per Cycle (hours)
VideoRetentionConfig.reconciliationCatchUpHours.description=Maximum event-time span processed per scheduler cycle while a full-history sweep advances toward its frozen end
VideoRetentionConfig.reconciliationPeriodHours.label=Historical Reconciliation Period (hours)
VideoRetentionConfig.reconciliationPeriodHours.description=Delay after a complete frozen full-history sweep before restarting at the earliest eligible occupancy; active and failed sweeps resume next cycle
VideoRetentionConfig.occupancyStreamRefreshMinutes.label=Occupancy Stream Refresh Period (minutes)
VideoRetentionConfig.occupancyStreamRefreshMinutes.description=How often cached occupancy datastream IDs are refreshed so observation queries can use IDs directly
VideoRetentionConfig.maintenanceWorkLimit.label=Media Maintenance Work Limit
VideoRetentionConfig.maintenanceWorkLimit.description=Maximum catalog-reconciliation, source-lifecycle, and retry entries inspected per cycle
VideoRetentionConfig.metadataReclamationWorkLimit.label=Media Metadata Reclamation Work Limit
VideoRetentionConfig.metadataReclamationWorkLimit.description=Maximum UTC processed-observation hours reclaimed per cycle; each hour uses twelve fixed five-minute probes without a directory scan
VideoRetentionConfig.enableFrameRetention.label=Enable Frame Retention
VideoRetentionConfig.enableFrameRetention.description=Remove all but the configured number of frames instead of deleting the entire clip
VideoRetentionConfig.frameRetentionCount.label=Retained Frame Count
VideoRetentionConfig.frameRetentionCount.description=Number of video frames to preserve when frame retention is enabled
VideoRetentionConfig.jpegQuality.label=Retained JPEG Quality
VideoRetentionConfig.jpegQuality.description=Baseline sRGB JPEG quality from 1 through 100
VideoRetentionConfig.sourceRollbackGraceHours.label=Source Rollback Grace (hours)
VideoRetentionConfig.sourceRollbackGraceHours.description=Hours to preserve the source video after the five JPEGs are durably published

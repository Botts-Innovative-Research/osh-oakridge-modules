description = 'Durable OSCAR Daily File Journal Service'
ext.details = 'Crash-recoverable direct journal and atomic legacy daily-file publisher'
version = '1.0.0'

dependencies {
    implementation 'org.sensorhub:sensorhub-core:' + oshCoreVersion
    implementation project(':sensorhub-utils-rad')

    testImplementation('junit:junit:4.13.2')
}

test {
    useJUnit()
}

osgi {
    manifest {
        attributes('Bundle-Vendor': 'Botts Innovative Research, Inc.')
        attributes('Bundle-Activator': 'com.botts.impl.service.dailyfile.Activator')
    }
}
